name: Automate Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags matching v*, e.g., v2.0.0

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gates
        run: npm run quality

      - name: Build Web Assets
        run: npm run build

      - name: Package Release ZIP
        run: node scripts/release.mjs

      - name: Validate Release Package
        run: npm run release:check

      - name: Extract Release Version & Info
        id: get_tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.get_tag.outputs.TAG_NAME }}
          body: |
            Production-ready static theme package built with Vite.
            
            Download `inkflow-admin-v*.zip` below for the pre-built template (HTML + `assets/css/inkflow-admin.css` + `assets/js/inkflow-admin.js`).
            
            [Full Changelog: ${{ steps.get_tag.outputs.PREV_TAG }}...${{ steps.get_tag.outputs.TAG_NAME }}](https://github.com/${{ github.repository }}/compare/${{ steps.get_tag.outputs.PREV_TAG }}...${{ steps.get_tag.outputs.TAG_NAME }})
          draft: false
          prerelease: false
          files: |
            releases/inkflow-admin-*.zip
