<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑标签 — InkFlow</title>
    {{> head_assets }}
  </head>
  <body>
    <!-- SIDEBAR -->
    {{> sidebar }}
    <div id="sidebar-overlay"></div>
    <div id="main-wrapper">
      <!-- TOPBAR -->
      {{#> topbar}}
        <li class="breadcrumb-item"><a href="index.html">首页</a></li> <li class="breadcrumb-item"><a href="tag-list.html">标签管理</a></li> <li class="breadcrumb-item active" aria-current="page">编辑标签</li>
      {{/topbar}}
      <main id="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">编辑标签</h1>
          </div>
          <a href="tag-list.html" class="btn btn-light"
            ><i class="bi bi-arrow-left"></i> 返回列表</a
          >
        </div>
        <div class="row g-3">
          <div class="col-12 col-xl-8">
            <div class="ink-panel ink-anim">
              <div class="ink-panel-header"><i class="bi bi-tag"></i> 标签信息</div>
              <div class="ink-panel-body">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label">标签名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" value="Vue 3" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">URL Slug</label>
                    <input type="text" class="form-control" value="vue3" />
                    <div class="ink-form-hint">留空则自动生成</div>
                  </div>
                  <div class="col-12">
                    <label class="form-label">标签描述</label>
                    <textarea class="form-control" rows="2" placeholder="简短描述这个标签的含义…">
Vue.js 3.x 版本相关内容，包括 Composition API、响应式系统等新特性。</textarea
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="ink-panel ink-anim ink-delay-100">
              <div class="ink-panel-header"><i class="bi bi-search-heart"></i> SEO 设置</div>
              <div class="ink-panel-body">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">SEO 标题</label
                    ><input type="text" class="form-control" value="Vue 3 标签 | InkFlow 博客" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Meta 描述</label
                    ><textarea class="form-control" rows="2">
汇聚所有 Vue 3 相关技术文章，涵盖入门到进阶的完整学习路径。</textarea
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button
                class="btn btn-primary btn-sm"
                data-action="toast"
                data-toast-msg="标签保存成功"
                data-toast-type="success"
              >
                <i class="bi bi-check-lg me-1"></i>保存标签
              </button>
              <button class="btn btn-light" data-action="navigate" data-href="tag-list.html">
                取消
              </button>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="ink-panel ink-anim ink-delay-50">
              <div class="ink-panel-header"><i class="bi bi-bar-chart-line"></i> 标签统计</div>
              <div class="ink-panel-body">
                <div class="d-flex flex-column gap-2 u-text-body">
                  <div
                    class="d-flex justify-content-between py-1 border-bottom border-ink-gray-100"
                  >
                    <span class="text-muted">关联文章</span><strong>34 篇</strong>
                  </div>
                  <div
                    class="d-flex justify-content-between py-1 border-bottom border-ink-gray-100"
                  >
                    <span class="text-muted">总浏览量</span><strong>84,291</strong>
                  </div>
                  <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">创建时间</span><strong>2025-01-12</strong>
                  </div>
                </div>
              </div>
            </div>
            <div class="ink-panel ink-anim ink-delay-150">
              <div class="ink-panel-header"><i class="bi bi-lightning"></i> 批量操作</div>
              <div class="ink-panel-body">
                <p class="u-text-sm u-text-gray-500">
                  可批量导入标签，每行一个标签名，自动生成 Slug。
                </p>
                <textarea
                  class="form-control"
                  rows="4"
                  placeholder="每行一个标签名，如：&#10;JavaScript&#10;CSS3&#10;HTML5"
                ></textarea>
                <button
                  class="btn btn-outline-primary btn-sm w-100 mt-2"
                  data-action="toast"
                  data-toast-msg="批量导入成功"
                  data-toast-type="success"
                >
                  <i class="bi bi-upload me-1"></i>批量导入
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/assets/js/inkflow-admin.js"></script>
  </body>
</html>
