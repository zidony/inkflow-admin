<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑链接 — InkFlow</title>
    {{> head_assets }}
  </head>
  <body>
    <!-- SIDEBAR -->
    {{> sidebar }}
    <div id="sidebar-overlay"></div>
    <div id="main-wrapper">
      <!-- TOPBAR -->
      {{#> topbar}}
        <li class="breadcrumb-item"><a href="index.html">首页</a></li> <li class="breadcrumb-item"><a href="link-list.html">链接管理</a></li> <li class="breadcrumb-item active" aria-current="page">编辑链接</li>
      {{/topbar}}
      <main id="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">编辑链接</h1>
          </div>
          <a href="link-list.html" class="btn btn-light"
            ><i class="bi bi-arrow-left"></i> 返回列表</a
          >
        </div>
        <div class="row g-3">
          <div class="col-12 col-xl-8">
            <div class="ink-panel ink-anim">
              <div class="ink-panel-header"><i class="bi bi-link-45deg"></i> 链接信息</div>
              <div class="ink-panel-body">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">链接名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" value="GitHub" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">链接地址 <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-globe"></i></span>
                      <input
                        type="url"
                        class="form-control"
                        value="/links/example"
                        placeholder="/links/example"
                      />
                      <button
                        class="btn btn-light"
                        data-action="toast"
                        data-toast-msg="链接有效"
                        data-toast-type="success"
                      >
                        <i class="bi bi-check-circle me-1"></i>验证
                      </button>
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">链接分组</label>
                    <select class="form-select">
                      <option>友情链接</option>
                      <option selected>参考文档</option>
                      <option>框架官网</option>
                      <option>博客推荐</option>
                      <option>技术社区</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">排序权重</label>
                    <input type="number" class="form-control" value="100" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">链接描述</label>
                    <textarea class="form-control" rows="2" placeholder="一句话描述该链接…">
代码托管平台，全球最大开源社区，支持 Git 版本管理。</textarea
                    >
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">链接图标（Favicon URL）</label>
                    <input
                      type="url"
                      class="form-control"
                      placeholder="/assets/favicon.ico"
                    />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">打开方式</label>
                    <select class="form-select">
                      <option value="_blank" selected>新标签页打开</option>
                      <option value="_self">当前页打开</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <div class="d-flex align-items-center gap-3">
                      <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="link-status" checked />
                        <label class="form-check-label u-text-body" for="link-status"
                          >启用该链接</label
                        >
                      </div>
                      <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="link-nofollow" />
                        <label class="form-check-label u-text-body" for="link-nofollow"
                          >添加 nofollow</label
                        >
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button
                class="btn btn-primary btn-sm"
                data-action="toast"
                data-toast-msg="链接保存成功"
                data-toast-type="success"
              >
                <i class="bi bi-check-lg me-1"></i>保存链接
              </button>
              <button class="btn btn-light" data-action="navigate" data-href="link-list.html">
                取消
              </button>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="ink-panel ink-anim ink-delay-50">
              <div class="ink-panel-header"><i class="bi bi-eye"></i> 链接预览</div>
              <div class="ink-panel-body">
                <div class="ink-link-preview-card">
                  <div class="d-flex align-items-center gap-3">
                    <div class="ink-link-favicon u-text-gray-600">
                      <i class="bi bi-github"></i>
                    </div>
                    <div>
                      <div class="fw-bold u-text-gray-800 fs-90">GitHub</div>
                      <div class="u-text-xs u-text-primary">/links/example</div>
                      <div class="ink-link-preview-desc u-text-gray-400 u-text-xs">
                        代码托管平台，全球最大开源社区
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="ink-panel ink-anim ink-delay-150">
              <div class="ink-panel-header"><i class="bi bi-bar-chart-line"></i> 点击统计</div>
              <div class="ink-panel-body">
                <div class="d-flex flex-column gap-2 u-text-body">
                  <div
                    class="d-flex justify-content-between py-1 border-bottom border-ink-gray-100"
                  >
                    <span class="text-muted">总点击数</span><strong>1,284</strong>
                  </div>
                  <div
                    class="d-flex justify-content-between py-1 border-bottom border-ink-gray-100"
                  >
                    <span class="text-muted">本月点击</span><strong>128</strong>
                  </div>
                  <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">添加时间</span><strong>2025-01-10</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/assets/js/inkflow-admin.js"></script>
  </body>
</html>
