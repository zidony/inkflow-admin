<div class="card-footer d-flex align-items-center justify-content-between">
  <span class="u-text-gray-500 u-text-sm">{{{summary}}}</span>
  <nav aria-label="{{ariaLabel}}">
    <ul class="pagination mb-0">
      <li class="page-item disabled">
        <button type="button" class="page-link" aria-label="{{prevLabel}}" disabled>
          <i class="bi bi-chevron-left u-icon-xs" aria-hidden="true"></i>
        </button>
      </li>
      <li class="page-item active"><button type="button" class="page-link" aria-current="page">1</button></li>
      <li class="page-item"><button type="button" class="page-link">2</button></li>
      <li class="page-item"><button type="button" class="page-link">3</button></li>
      <li class="page-item">
        <button type="button" class="page-link" aria-label="{{nextLabel}}">
          <i class="bi bi-chevron-right u-icon-xs" aria-hidden="true"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
