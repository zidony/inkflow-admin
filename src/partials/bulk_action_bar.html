<div class="ink-bulk-bar" id="bulk-action-bar">
  <i class="bi bi-check2-all u-text-primary" aria-hidden="true"></i>
  <span>已选 <strong id="bulk-count">0</strong> 项</span>
  <div class="ms-auto d-flex gap-2">
    <button type="button"
      class="btn btn-light btn-sm u-text-sm"
      data-action="toast"
      data-toast-msg="操作成功"
      data-toast-type="success"
    >
      <i class="bi bi-check-lg me-1" aria-hidden="true"></i>批量操作
    </button>
    <button type="button"
      class="btn btn-danger-soft btn-sm u-text-sm"
      data-action="toast"
      data-toast-msg="已删除"
      data-toast-type="danger"
    >
      <i class="bi bi-trash3 me-1" aria-hidden="true"></i>批量删除
    </button>
  </div>
</div>
